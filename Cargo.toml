[workspace]

members = [
    "core", # lodestone_core
    "dashboard/src-tauri" #lodestone-client
]
default-members = ["core"] # Run `cargo install tauri` then `cargo tauri build` to build the client
resolver = "2"

[profile.github-release]
inherits = "release"
strip = true
opt-level = "s"
lto = "thin"
codegen-units = 1

[workspace.package]
version = "0.5.1"
homepage = "https://github.com/Lodestone-Team"
readme = "README.md"
edition = "2021"
license = "APGL-3.0"
authors = ["Lodestone Team"]
rust-version = "1.96"

# v8 0.73 (pulled in by deno_core 0.190) asserts `TypeId` is 64 bits, which is
# false since Rust 1.72. vendor/v8 is the published crate with that hasher
# fixed; it still downloads the same prebuilt librusty_v8 0.73.0.
[patch.crates-io]
v8 = { path = "vendor/v8" }
